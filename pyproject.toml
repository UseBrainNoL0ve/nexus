[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-linux"
version = "0.2.0a1"
description = "Safety-first Linux system intelligence and automation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Abdullah Enes Gülerli" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PySide6>=6.7,<7",
]

[project.scripts]
nexus = "nexus.cli:main"
nexus-gui = "nexus.gui.app:main"
nexus-scheduler = "nexus.scheduler.commands:main"

[tool.setuptools.packages.find]
where = ["src"]
